<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家事ライフログ MVP</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #1a1a1a;
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    padding: 16px;
    padding-bottom: 80px;
  }
  .screen { max-width: 480px; margin: 0 auto; }
  .hidden { display: none; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .lead {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 12px;
    color: #888;
    margin: 20px 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  /* 候補リストチェックボックス */
  .preset-item {
    background: #2a2a2a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
  }
  .preset-item:active { background: #333; }
  .preset-item.checked {
    background: #2c4a6e;
  }
  .preset-checkbox {
    width: 24px;
    height: 24px;
    border: 2px solid #666;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
  }
  .preset-item.checked .preset-checkbox {
    background: #3a7bd5;
    border-color: #3a7bd5;
  }
  .preset-name {
    font-size: 16px;
    flex: 1;
  }
  /* ボタン */
  .btn {
    width: 100%;
    background: #3a7bd5;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn:active { background: #2c5fa8; }
  .btn:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: #333;
    color: #eee;
  }
  .btn-secondary:active { background: #444; }
  .btn-large {
    padding: 28px;
    font-size: 20px;
  }
  /* 実行モード */
  .running-container {
    min-height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px 0;
  }
  .remaining-count {
    font-size: 14px;
    color: #888;
    margin-bottom: 24px;
  }
  .current-task-name {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 32px;
    line-height: 1.3;
  }
  .timer {
    font-size: 44px;
    font-weight: 300;
    color: #888;
    font-variant-numeric: tabular-nums;
    margin-bottom: 32px;
  }
  .over-message {
    background: #2c4a6e;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 15px;
    color: #fff;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .running-controls {
    width: 100%;
    max-width: 360px;
  }
  /* 完了画面 */
  .done-celebration {
    text-align: center;
    padding: 40px 0;
  }
  .done-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .done-sub {
    color: #888;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .log-item {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-name { font-size: 15px; }
  .log-time { font-size: 13px; color: #888; font-variant-numeric: tabular-nums; }
  /* 完了アニメーション */
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .complete-flash {
    position: fixed;
    inset: 0;
    background: rgba(58, 123, 213, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeOut 1s forwards;
    pointer-events: none;
  }
  .complete-flash-content {
    text-align: center;
  }
  .complete-flash-check {
    font-size: 80px;
    font-weight: 700;
    color: #fff;
    animation: pop 0.4s;
    line-height: 1;
    margin-bottom: 16px;
  }
  .complete-flash-time {
    font-size: 22px;
    color: #fff;
    font-weight: 600;
    animation: pop 0.5s;
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  /* 目標時間 */
  .target-input {
    width: 60px;
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px;
    text-align: center;
    font-size: 14px;
  }
  .planning-task-row {
    background: #2a2a2a;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .planning-task-name {
    flex: 1;
    font-size: 15px;
  }
  .planning-task-min {
    color: #888;
    font-size: 13px;
  }
  .move-btn {
    background: #333;
    color: #eee;
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .move-btn:active { background: #444; }
  .move-btn:disabled {
    background: #222;
    color: #444;
    cursor: not-allowed;
  }
  .move-btn-group {
    display: flex;
    gap: 4px;
  }
</style>
</head>
<body>

<div id="screen-planning" class="screen">
  <h1>今日のタスクを選ぼう</h1>
  <p class="lead">タップで選択。終わったら「順番を決める」へ</p>
  <div id="preset-list"></div>
  <button class="btn" id="btn-to-ordering" disabled>順番を決める →</button>
</div>

<div id="screen-ordering" class="screen hidden">
  <h1>順番を決めよう</h1>
  <p class="lead">↑↓で並び替え。OKなら「リスト確定」</p>
  <div id="ordering-list"></div>
  <button class="btn" id="btn-confirm">リスト確定 → 実行スタート</button>
  <button class="btn btn-secondary" id="btn-back-to-planning">← タスク選択に戻る</button>
</div>

<div id="screen-running" class="screen hidden">
  <div class="running-container">
    <div class="remaining-count" id="remaining-count">あと N 個</div>
    <div class="current-task-name" id="current-task-name">タスク名</div>
    <div class="timer" id="timer">00:00</div>
    <div class="running-controls">
      <button class="btn btn-large" id="btn-start">開始</button>
      <button class="btn btn-large hidden" id="btn-finish">終了</button>
    </div>
  </div>
</div>

<div id="screen-done" class="screen hidden">
  <div class="done-celebration">
    <div class="done-title">今日のタスク、全部終わったよ</div>
    <div class="done-sub">お疲れさま</div>
  </div>
  <div class="section-title">今日のログ</div>
  <div id="done-log-list"></div>
  <button class="btn btn-secondary" id="btn-restart">最初に戻る</button>
</div>

<script>
'use strict';

// ============ 初期候補（あゆみ確定） ============
const DEFAULT_PRESETS = [
  '洗濯機回す',
  '皿洗い',
  'トイレ掃除',
  '夕ご飯作る',
  'お弁当作る',
  '机の上片付ける',
  '洗濯干す',
  '洗濯畳む',
  '畳んだ洗濯物戻す',
  '掃除機orルンバ'
];
const DEFAULT_TARGET_MIN = 15;
const STORAGE_KEY = 'housework-mvp-v1';

// ============ 状態 ============
let state = {
  presets: [...DEFAULT_PRESETS],     // 候補リスト（永続）
  selected: [],                       // 朝に選ばれたタスク名（順序付き）
  taskTargets: {},                    // { taskName: 分 }
  todayList: [],                      // 実行モード用 [{name, targetSec, startedAt, finishedAt}]
  currentIndex: 0,
  mode: 'planning',                   // 'planning' | 'ordering' | 'running' | 'done'
  taskStartedAt: null,                // 現タスクの開始時刻（ms）
  isRunning: false,                   // 「開始」ボタン押下後trueに
  log: []                             // 完了したタスクのログ
};

// ============ 永続化 ============
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.presets) state.presets = parsed.presets;
    // 当日のセッションは復元しない（毎朝リセット）
  } catch (e) {
    console.warn('loadState failed', e);
  }
}
function savePresets() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    data.presets = state.presets;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { console.warn(e); }
}
function saveDailyLog(log) {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    data.dailyLogs = data.dailyLogs || {};
    const today = new Date().toISOString().slice(0, 10);
    data.dailyLogs[today] = log;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { console.warn(e); }
}

// ============ 画面切替 ============
function showScreen(name) {
  ['planning', 'ordering', 'running', 'done'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
  });
  state.mode = name;
}

// ============ 画面1: 朝のタスク選択 ============
function renderPlanning() {
  const list = document.getElementById('preset-list');
  list.innerHTML = '';
  state.presets.forEach(name => {
    const isChecked = state.selected.includes(name);
    const item = document.createElement('div');
    item.className = 'preset-item' + (isChecked ? ' checked' : '');
    item.innerHTML = `
      <div class="preset-checkbox">${isChecked ? '✓' : ''}</div>
      <div class="preset-name">${escapeHtml(name)}</div>
    `;
    item.onclick = () => togglePreset(name);
    list.appendChild(item);
  });
  document.getElementById('btn-to-ordering').disabled = state.selected.length === 0;
}
function togglePreset(name) {
  const i = state.selected.indexOf(name);
  if (i >= 0) state.selected.splice(i, 1);
  else state.selected.push(name);
  renderPlanning();
}

// ============ 画面2: 順番と目標時間 ============
function renderOrdering() {
  const list = document.getElementById('ordering-list');
  list.innerHTML = '';
  state.selected.forEach((name, idx) => {
    const isFirst = idx === 0;
    const isLast = idx === state.selected.length - 1;
    const row = document.createElement('div');
    row.className = 'planning-task-row';
    row.innerHTML = `
      <div class="planning-task-name">${idx + 1}. ${escapeHtml(name)}</div>
      <div class="move-btn-group">
        <button class="move-btn" ${isFirst ? 'disabled' : ''} data-action="up" data-idx="${idx}">↑</button>
        <button class="move-btn" ${isLast ? 'disabled' : ''} data-action="down" data-idx="${idx}">↓</button>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.move-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const action = btn.dataset.action;
      if (action === 'up' && idx > 0) {
        [state.selected[idx - 1], state.selected[idx]] = [state.selected[idx], state.selected[idx - 1]];
      } else if (action === 'down' && idx < state.selected.length - 1) {
        [state.selected[idx + 1], state.selected[idx]] = [state.selected[idx], state.selected[idx + 1]];
      }
      renderOrdering();
    };
  });
}

// ============ 画面3: 実行モード ============
let timerInterval = null;
function updateTimer() {
  if (!state.isRunning || !state.taskStartedAt) {
    document.getElementById('timer').textContent = '00:00';
    return;
  }
  const elapsedSec = Math.floor((Date.now() - state.taskStartedAt) / 1000);
  const m = Math.floor(elapsedSec / 60);
  const s = elapsedSec % 60;
  document.getElementById('timer').textContent =
    `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function startRunning() {
  state.todayList = state.selected.map(name => ({
    name,
    startedAt: null,
    finishedAt: null,
    elapsedSec: 0
  }));
  state.currentIndex = 0;
  state.log = [];
  showScreen('running');
  renderRunning();
}
function renderRunning() {
  const task = state.todayList[state.currentIndex];
  if (!task) return;
  const remaining = state.todayList.length - state.currentIndex;
  document.getElementById('remaining-count').textContent =
    remaining === 1 ? 'これで最後' : `あと ${remaining} 個`;
  document.getElementById('current-task-name').textContent = task.name;
  document.getElementById('btn-start').classList.toggle('hidden', state.isRunning);
  document.getElementById('btn-finish').classList.toggle('hidden', !state.isRunning);
  if (!state.isRunning) {
    document.getElementById('timer').textContent = '00:00';
  }
}
function startTask() {
  state.isRunning = true;
  state.taskStartedAt = Date.now();
  state.todayList[state.currentIndex].startedAt = state.taskStartedAt;
  renderRunning();
  updateTimer();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}
function finishTask() {
  const task = state.todayList[state.currentIndex];
  task.finishedAt = Date.now();
  task.elapsedSec = Math.floor((task.finishedAt - task.startedAt) / 1000);
  state.log.push({ ...task });
  saveDailyLog(state.log);
  if (timerInterval) clearInterval(timerInterval);
  showCompleteFlash(task.elapsedSec);
  state.isRunning = false;
  state.taskStartedAt = null;
  state.currentIndex++;
  setTimeout(() => {
    if (state.currentIndex >= state.todayList.length) {
      showDone();
    } else {
      renderRunning();
    }
  }, 1800);
}
function showCompleteFlash(elapsedSec) {
  const m = Math.floor(elapsedSec / 60);
  const s = elapsedSec % 60;
  let timeText;
  if (m === 0) {
    timeText = `${s}秒でできた`;
  } else if (s === 0) {
    timeText = `${m}分でできた`;
  } else {
    timeText = `${m}分${s}秒でできた`;
  }
  const flash = document.createElement('div');
  flash.className = 'complete-flash';
  flash.innerHTML = `
    <div class="complete-flash-content">
      <div class="complete-flash-check">✓</div>
      <div class="complete-flash-time">${timeText}</div>
    </div>
  `;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1800);
}

// ============ 画面4: 完了 ============
function showDone() {
  showScreen('done');
  const list = document.getElementById('done-log-list');
  list.innerHTML = '';
  state.log.forEach(item => {
    const m = Math.floor(item.elapsedSec / 60);
    const s = item.elapsedSec % 60;
    const row = document.createElement('div');
    row.className = 'log-item';
    row.innerHTML = `
      <div class="log-name">${escapeHtml(item.name)}</div>
      <div class="log-time">${m}分${String(s).padStart(2, '0')}秒</div>
    `;
    list.appendChild(row);
  });
}
function restart() {
  state.selected = [];
  state.taskTargets = {};
  state.todayList = [];
  state.currentIndex = 0;
  state.log = [];
  state.isRunning = false;
  state.taskStartedAt = null;
  if (timerInterval) clearInterval(timerInterval);
  showScreen('planning');
  renderPlanning();
}

// ============ ユーティリティ ============
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ============ イベント ============
document.getElementById('btn-to-ordering').onclick = () => {
  showScreen('ordering');
  renderOrdering();
};
document.getElementById('btn-back-to-planning').onclick = () => {
  showScreen('planning');
  renderPlanning();
};
document.getElementById('btn-confirm').onclick = () => {
  startRunning();
};
document.getElementById('btn-start').onclick = startTask;
document.getElementById('btn-finish').onclick = finishTask;
document.getElementById('btn-restart').onclick = restart;

// ============ URL Payload Intake ============
function parsePayloadFromUrl() {
  try {
    // Check both query string and hash
    const urlParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    
    const payloadStr = urlParams.get('payload') || hashParams.get('payload');
    if (!payloadStr) return null;
    
    const payload = JSON.parse(decodeURIComponent(payloadStr));
    
    // Validate payload structure
    if (!payload.tasks || !Array.isArray(payload.tasks) || payload.tasks.length === 0) {
      console.warn('Invalid payload: missing or empty tasks array');
      return null;
    }
    
    // Cap at first 8 tasks
    const tasks = payload.tasks.slice(0, 8).filter(t => typeof t === 'string' && t.trim());
    
    if (tasks.length === 0) {
      console.warn('Invalid payload: no valid task strings');
      return null;
    }
    
    return { tasks };
  } catch (e) {
    console.warn('Failed to parse payload from URL:', e);
    return null;
  }
}

function startWithPayload(tasks) {
  // Set up state with payload tasks
  state.selected = [...tasks];
  state.todayList = tasks.map(name => ({
    name,
    startedAt: null,
    finishedAt: null,
    elapsedSec: 0
  }));
  state.currentIndex = 0;
  state.log = [];
  
  // Strip payload from URL so refresh doesn't re-import
  const cleanUrl = window.location.pathname;
  history.replaceState({}, document.title, cleanUrl);
  
  // Go directly to running state
  showScreen('running');
  renderRunning();
}

// ============ 起動 ============
loadState();

// Check for payload and start directly if valid
const payload = parsePayloadFromUrl();
if (payload) {
  startWithPayload(payload.tasks);
} else {
  renderPlanning();
  showScreen('planning');
}
</script>
</body>
</html>
